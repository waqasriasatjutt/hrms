<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body style="font-family: Arial, sans-serif; padding: 20px;">

        <h1 style="text-align: center;">Multi-Currency PoS Payment</h1>

        <!-- Item 1 -->
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
            <img src="./images/config.png" alt="Config" style="width: 60%; height: auto; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px;">
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
            <img src="./images/allow.png" alt="Allow Currency" style="width: 60%; height: auto; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px;">
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
            <img src="./images/select_currency.png" alt="Select Currency" style="width: 60%; height: auto; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px;">
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
            <img src="./images/add_payment.png" alt="Add payment" style="width: 60%; height: auto; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px;">
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
            <img src="./images/change.png" alt="Change" style="width: 60%; height: auto; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px;">
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
            <img src="./images/slip.png" alt="Receipt" style="width: 60%; height: auto; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px;">
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
            <img src="./images/currency.png" alt="Order Currency" style="width: 60%; height: auto; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px;">
        </div>
    </body>
</html>
