<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0A2E;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1A0F4F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1B3E;stop-opacity:1"/>
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glow1" cx="30%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6C47FF;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#6C47FF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </radialGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1448;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16103A;stop-opacity:1"/>
    </linearGradient>
    <!-- Bar gradients -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6C47FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <!-- Line gradient fill -->
    <linearGradient id="lineFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6C47FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#6C47FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.06" stroke="#A78BFA" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- ── LEFT SIDE: Text ─────────────────────────────────── -->

  <!-- Badge -->
  <rect x="60" y="62" width="160" height="26" rx="13" fill="#6C47FF" opacity="0.25"/>
  <rect x="60" y="62" width="160" height="26" rx="13" fill="none" stroke="#6C47FF" stroke-width="1" opacity="0.6"/>
  <text x="140" y="80" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#A78BFA" letter-spacing="1.5">ODOO 18 MODULE</text>

  <!-- Module name -->
  <text x="60" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" filter="url(#shadow)">WT POS Analytics</text>
  <text x="60" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="800" fill="url(#bar1)" filter="url(#shadow)">Dashboard</text>

  <!-- Subtitle -->
  <text x="60" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#94A3B8">Enterprise KPIs · Charts · Filters · CSV Export</text>

  <!-- Feature pills -->
  <rect x="60" y="262" width="90" height="24" rx="12" fill="#6C47FF" opacity="0.2"/>
  <rect x="60" y="262" width="90" height="24" rx="12" fill="none" stroke="#6C47FF" stroke-width="1" opacity="0.5"/>
  <text x="105" y="279" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#A78BFA">9 KPI Cards</text>

  <rect x="160" y="262" width="82" height="24" rx="12" fill="#3B82F6" opacity="0.2"/>
  <rect x="160" y="262" width="82" height="24" rx="12" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
  <text x="201" y="279" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#60A5FA">7 Charts</text>

  <rect x="252" y="262" width="86" height="24" rx="12" fill="#10B981" opacity="0.2"/>
  <rect x="252" y="262" width="86" height="24" rx="12" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <text x="295" y="279" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#34D399">6 Tabs</text>

  <rect x="348" y="262" width="98" height="24" rx="12" fill="#F59E0B" opacity="0.2"/>
  <rect x="348" y="262" width="98" height="24" rx="12" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  <text x="397" y="279" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#FCD34D">CSV Export</text>

  <!-- Way4Tech branding -->
  <text x="60" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#6C47FF" opacity="0.9">way4tech.com</text>
  <text x="60" y="360" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#475569">by Waqas Riasat · OPL-1 · One-time purchase</text>

  <!-- ── RIGHT SIDE: Mini dashboard mockup ──────────────── -->

  <!-- Main card background -->
  <rect x="560" y="30" width="600" height="340" rx="16" fill="url(#cardGrad)" filter="url(#shadow)" opacity="0.95"/>
  <rect x="560" y="30" width="600" height="340" rx="16" fill="none" stroke="#6C47FF" stroke-width="1" opacity="0.3"/>

  <!-- Top bar of mockup -->
  <rect x="560" y="30" width="600" height="44" rx="16" fill="#1A1040"/>
  <rect x="560" y="56" width="600" height="18" fill="#1A1040"/>
  <circle cx="592" cy="52" r="6" fill="#FF5F57"/>
  <circle cx="612" cy="52" r="6" fill="#FEBC2E"/>
  <circle cx="632" cy="52" r="6" fill="#28C840"/>
  <text x="680" y="57" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748B">POS Analytics Dashboard</text>

  <!-- KPI cards row -->
  <!-- Card 1 -->
  <rect x="576" y="90" width="110" height="62" rx="8" fill="#211650"/>
  <rect x="576" y="90" width="110" height="3" rx="2" fill="#6C47FF"/>
  <text x="586" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$11.9K</text>
  <text x="586" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">Revenue</text>
  <text x="586" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#10B981">▲ 12%</text>

  <!-- Card 2 -->
  <rect x="696" y="90" width="110" height="62" rx="8" fill="#211650"/>
  <rect x="696" y="90" width="110" height="3" rx="2" fill="#3B82F6"/>
  <text x="706" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">248</text>
  <text x="706" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">Orders</text>
  <text x="706" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#10B981">▲ 8%</text>

  <!-- Card 3 -->
  <rect x="816" y="90" width="110" height="62" rx="8" fill="#211650"/>
  <rect x="816" y="90" width="110" height="3" rx="2" fill="#10B981"/>
  <text x="826" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">$48.0</text>
  <text x="826" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">Avg Order</text>
  <text x="826" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#EF4444">▼ 2%</text>

  <!-- Card 4 -->
  <rect x="936" y="90" width="108" height="62" rx="8" fill="#211650"/>
  <rect x="936" y="90" width="108" height="3" rx="2" fill="#F59E0B"/>
  <text x="946" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1,340</text>
  <text x="946" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">Items Sold</text>
  <text x="946" y="142" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#10B981">▲ 5%</text>

  <!-- Tabs -->
  <rect x="576" y="164" width="76" height="22" rx="6" fill="#6C47FF"/>
  <text x="614" y="179" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Overview</text>
  <text x="672" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#475569">Financial</text>
  <text x="726" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#475569">Products</text>
  <text x="785" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#475569">Customers</text>
  <text x="850" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#475569">Sessions</text>
  <text x="907" y="179" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#475569">Compare</text>

  <!-- Chart area -->
  <rect x="576" y="196" width="330" height="150" rx="8" fill="#1A1040"/>
  <text x="590" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="600" fill="#94A3B8">Sales Trend</text>

  <!-- Line chart -->
  <polyline points="590,330 620,310 650,320 680,290 710,300 740,270 770,280 800,250 830,260 860,235 886,240"
            fill="none" stroke="#6C47FF" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="590,330 620,310 650,320 680,290 710,300 740,270 770,280 800,250 830,260 860,235 886,240 886,340 590,340"
           fill="url(#lineFill)" opacity="0.4"/>
  <!-- Dots -->
  <circle cx="740" cy="270" r="3" fill="#6C47FF"/>
  <circle cx="860" cy="235" r="3" fill="#8B5CF6"/>

  <!-- Bar chart on right -->
  <rect x="920" y="196" width="224" height="150" rx="8" fill="#1A1040"/>
  <text x="934" y="214" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="600" fill="#94A3B8">Top Products</text>

  <!-- Bars -->
  <rect x="934" y="280" width="30" height="60" rx="3" fill="url(#bar1)" opacity="0.9"/>
  <rect x="974" y="260" width="30" height="80" rx="3" fill="url(#bar2)" opacity="0.9"/>
  <rect x="1014" y="295" width="30" height="45" rx="3" fill="url(#bar3)" opacity="0.9"/>
  <rect x="1054" y="270" width="30" height="70" rx="3" fill="url(#bar1)" opacity="0.7"/>
  <rect x="1094" y="285" width="30" height="55" rx="3" fill="url(#bar2)" opacity="0.7"/>

  <!-- Bottom accent line -->
  <rect x="560" y="368" width="600" height="2" rx="1" fill="url(#bar1)" opacity="0.5"/>

  <!-- Decorative dots -->
  <circle cx="540" cy="80" r="60" fill="#6C47FF" opacity="0.04"/>
  <circle cx="540" cy="80" r="40" fill="#6C47FF" opacity="0.04"/>
  <circle cx="1180" cy="350" r="80" fill="#3B82F6" opacity="0.05"/>
</svg>
